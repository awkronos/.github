name: Reusable Lean Guard CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for structural/receipt/doc-leak guards
        type: string
        default: "3.13"
      guard-command:
        description: Portable guard command (runs on ubuntu-latest without blocking Lean build runners)
        type: string
        required: true
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 15

jobs:
  lean-guards:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure hermetic test git identity
        run: |
          git config --global user.name "Awkronos CI"
          git config --global user.email "ci@awkronos.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run portable Lean structural & receipt guards
        run: ${{ inputs.guard-command }}
